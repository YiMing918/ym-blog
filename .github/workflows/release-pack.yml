name: 部署包自动刷新

# 发版（Release 发布）时，自动按下面的清单从该标签的代码重打「手机部署包」，
# 并刷新到这个 Release（同名覆盖、旧日期的包会删掉，只留最新一个）。
# 也可以在 Actions 页手动运行：填一个已经存在的 Release 标签，给它补包/刷新包。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Release 标签（如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-pack
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 确定标签与包名
        id: t
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REL_TAG:-$IN_TAG}"
          if [ -z "$TAG" ]; then echo "::error::没有拿到 Release 标签"; exit 1; fi
          ZIPNAME="ym-blog-deploy-$(TZ=Asia/Shanghai date +%Y%m%d).zip"
          WZIPNAME="ym-blog-worker-deploy-$(TZ=Asia/Shanghai date +%Y%m%d).zip"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIPNAME" >> "$GITHUB_OUTPUT"
          echo "wzip=$WZIPNAME" >> "$GITHUB_OUTPUT"
          echo "本次处理：$TAG -> $ZIPNAME"

      - name: 拉取该标签的代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.t.outputs.tag }}

      - name: 按清单打包
        env:
          ZIPNAME: ${{ steps.t.outputs.zip }}
        run: |
          set -euo pipefail
          rm -rf stage && mkdir stage
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then echo "::error::清单里的文件不存在：$f"; exit 1; fi
            mkdir -p "stage/$(dirname "$f")"
            cp "$f" "stage/$f"
          done <<'PACKLIST'
          _headers
          _routes.json
          admin/admin.css
          admin/admin.js
          admin/index.html
          assets/css/site.css
          assets/js/beacon.js
          assets/js/site.js
          functions/[[path]].js
          functions/_handlers/admin-api.js
          functions/_handlers/ai-api.js
          functions/_handlers/auth-api.js
          functions/_handlers/feeds.js
          functions/_handlers/pages.js
          functions/_handlers/public-api.js
          functions/_handlers/tasks-api.js
          functions/_lib/ai.js
          functions/_lib/auth.js
          functions/_lib/backup.js
          functions/_lib/db.js
          functions/_lib/embed.js
          functions/_lib/hash.js
          functions/_lib/http.js
          functions/_lib/r2sign.js
          functions/_lib/ratelimit.js
          functions/_lib/render.js
          functions/_lib/sanitize.js
          functions/_lib/settings.js
          functions/_lib/ssrf.js
          functions/_lib/stats.js
          functions/_lib/turnstile.js
          package.json
          schema/0001_init.sql
          schema/0002_seed.sql
          schema/0003_fts.sql
          schema/0004_media_trash.sql
          schema/0005_comment_trash.sql
          wrangler.toml
          PACKLIST
          find stage -type f -exec touch -d '1980-01-01 00:00:00' {} +
          cd stage
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -q -X -D "../$ZIPNAME" -@
          cd ..
          sha256sum "$ZIPNAME" > SHA256SUMS.txt
          echo "包内文件："
          unzip -Z1 "$ZIPNAME"
          cat SHA256SUMS.txt


      - name: 打包直传专用包（_worker.js 高级模式）
        # 控制台拖拽上传不会编译 functions/，所以另产一个包：把根目录
        # catch-all 函数用 build/worker-entry.js 合成单个 _worker.js（原源码
        # 不改；node: 内置模块按外部引用，靠 nodejs_compat 运行时提供），
        # 与全部静态文件同放根目录。方式二（手机部署包控制台上传）专用。
        env:
          WZIPNAME: ${{ steps.t.outputs.wzip }}
        run: |
          set -euo pipefail
          npx -y esbuild@0.25.0 build/worker-entry.js --bundle --format=esm --platform=neutral --target=es2022 --external:node:* --outfile=_worker.js
          rm -rf wstage && mkdir wstage
          cp _worker.js wstage/
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then echo "::error::静态清单里的文件不存在：$f"; exit 1; fi
            mkdir -p "wstage/$(dirname "$f")"
            cp "$f" "wstage/$f"
          done <<'STATICLIST'
          _headers
          _routes.json
          admin/admin.css
          admin/admin.js
          admin/index.html
          assets/css/site.css
          assets/js/beacon.js
          assets/js/site.js
          package.json
          schema/0001_init.sql
          schema/0002_seed.sql
          schema/0003_fts.sql
          schema/0004_media_trash.sql
          schema/0005_comment_trash.sql
          wrangler.toml
          STATICLIST
          find wstage -type f -exec touch -d '1980-01-01 00:00:00' {} +
          cd wstage
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -q -X -D "../$WZIPNAME" -@
          cd ..
          sha256sum "$WZIPNAME" >> SHA256SUMS.txt
          echo "直传包内文件："
          unzip -Z1 "$WZIPNAME"
          cat SHA256SUMS.txt

      - name: 刷新到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.t.outputs.tag }}
          ZIPNAME: ${{ steps.t.outputs.zip }}
          WZIPNAME: ${{ steps.t.outputs.wzip }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null
          gh release delete-asset "$TAG" "SHA256SUMS.txt" -y || true
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^ym-blog-deploy-[0-9]{8}\.zip$' | grep -vx "$ZIPNAME" | while read -r a; do echo "删除旧包：$a"; gh release delete-asset "$TAG" "$a" -y; done || true
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^ym-blog-worker-deploy-[0-9]{8}\.zip$' | grep -vx "$WZIPNAME" | while read -r a; do echo "删除旧直传包：$a"; gh release delete-asset "$TAG" "$a" -y; done || true
          gh release upload "$TAG" "$ZIPNAME" "$WZIPNAME" SHA256SUMS.txt --clobber
          echo "已刷新到 Release $TAG：$ZIPNAME + $WZIPNAME + SHA256SUMS.txt"
