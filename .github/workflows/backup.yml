name: backup

# 每周双通道自动备份（两条管线互备，一条断了还有另一条）：
# 通道一：调站内 /api/tasks/backup —— 按表导出 JSON 存进私有备份桶并登记对账（保留最近 12 期）。
# 通道二：用 wrangler 直接对 D1 做一次官方整库导出（SQL），存为本仓库 Actions 的构建产物（artifact），保留 90 天。
# 通道二需要 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 两个 Secret，且 wrangler.toml 里的 database_id 要换成真实值；
# 没配齐时自动跳过该通道，不影响通道一。

on:
  schedule:
    - cron: '41 20 * * 0'   # UTC 周日 20:41 ≈ 北京时间周一 04:41
  workflow_dispatch:

jobs:
  backup-api:
    runs-on: ubuntu-latest
    steps:
      - name: 调站内备份任务（通道一）
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$TASK_SECRET" ]; then
            echo "未配置 SITE_URL / TASK_SECRET，跳过通道一。"; exit 0
          fi
          curl -fsS -X POST "$SITE_URL/api/tasks/backup" -H "X-Task-Secret: $TASK_SECRET" -H "Content-Type: application/json" -d '{}'

  backup-d1-export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: D1 整库导出并存产物（通道二，仅当配了令牌且 database_id 已填真实值）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "wrangler.toml 的 database_id 还是占位值，跳过通道二（先按 README 把真实 ID 填上）。"; exit 0
          fi
          npm install -g wrangler@3
          # 注意：库里有 FTS5 全文索引虚拟表（schema/0003）时，Cloudflare 官方整库导出会被服务端
          # 直接拒绝（cannot export databases with virtual tables）——这是平台限制不是故障：
          # 主备份走通道一（按表 JSON，刻意不含可重建的索引表），恢复后重跑 0003 的 rebuild 即可。
          # 故此处只把这一类失败降级为提示跳过，其余失败（如令牌失效）照常让任务变红。
          if ! wrangler d1 export ym-blog-db --remote --output backup-d1.sql 2>export-err.log; then
            cat export-err.log
            if grep -qi 'virtual table' export-err.log; then
              echo "库含 FTS5 虚拟表，官方整库导出不可用（平台限制），跳过通道二；通道一按表备份不受影响。"; exit 0
            fi
            exit 1
          fi
      - name: 上传 SQL 产物（保留 90 天）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: d1-export
          path: backup-d1.sql
          retention-days: 90
          if-no-files-found: ignore
