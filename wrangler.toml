# ym-blog 的 Cloudflare Pages 配置（示例值，部署时替换成你自己的）
# 注意：这里只写绑定名与公开变量，任何密钥真值都不进仓库，走 Pages 后台的 Secret。
name = "ym-blog"
compatibility_date = "2024-11-01"
# scrypt 密码哈希走 node:crypto，需要 nodejs_compat（见 functions/_lib/hash.js）
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# D1 数据库绑定：代码里统一用 env.DB
[[d1_databases]]
binding = "DB"
database_name = "ym-blog-db"
database_id = "00000000-0000-0000-0000-000000000000"

# R2 媒体桶绑定：代码里统一用 env.MEDIA（只用来 HEAD 校验/删除，文件本体不经过 Worker）
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ym-blog-media"

# R2 备份桶绑定：私有桶，不绑任何公开域名
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "ym-blog-backups"

[vars]
# 媒体公开访问域名（绑在媒体桶上的自定义域名，不要用 r2.dev，官方会限流）
MEDIA_PUBLIC_BASE = "https://media.example.com"
# R2 的 S3 API 端点（预签名直传用）：https://<账号ID>.r2.cloudflarestorage.com
R2_S3_ENDPOINT = "https://00000000000000000000000000000000.r2.cloudflarestorage.com"
R2_S3_BUCKET = "ym-blog-media"

# 以下为 Secret（在 Pages 后台 Settings → Environment variables 里以加密变量添加，不要写在这里）：
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY  —— S3 凭据，仅用于签发预签名 URL
# PASSWORD_PEPPER                          —— 密码哈希的服务端胡椒，丢了将无法校验旧密码
# TASK_SECRET                              —— 定时任务接口的调用密钥（GitHub Actions 用）
# INITIAL_ADMIN_USERNAME / INITIAL_ADMIN_PASSWORD —— 可选：首次初始化时自动建站长账号
# TURNSTILE_SECRET                         —— 可选：开启人机验证时才需要（站点 key 在后台设置里）
