name: deploy

# 推送到 main 或手动触发时，把站点部署到 Cloudflare Pages（推送即上线，改完代码不用手动碰 Cloudflare 后台）。
# 需在仓库 Settings → Secrets and variables → Actions 里加：
#   CLOUDFLARE_API_TOKEN（令牌模板选「编辑 Cloudflare Workers」再补 D1/R2/Pages 权限）
#   CLOUDFLARE_ACCOUNT_ID（Cloudflare 后台右下角/域名概述页可查）
# 没配这两个 Secret 时部署步会自动跳过（不报错）——Fork 的人也可以改用「Pages 后台连 Git 仓库」的方式部署，不受影响。
# 注意：本仓库没有构建步骤（静态文件直出 + Functions 原生 ES 模块），部署的是仓库根目录本身，别改成子目录。

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 部署到 Cloudflare Pages（仅当配了部署令牌）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx -y wrangler@3 pages deploy . --project-name ym-blog --branch main --commit-dirty=true
      - name: 未配令牌时给出提示
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次跳过部署（属正常：用 Pages 连 Git 部署的人不需要它们）。"
