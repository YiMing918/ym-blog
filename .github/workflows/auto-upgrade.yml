name: auto-upgrade

on:
  schedule:
    - cron: '50 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-upgrade-ym-blog
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 试升级依赖（锁文件范围内）
        run: |
          npm update --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: 跑仓库测试（不过不提交）
        run: |
          node --experimental-sqlite scripts/smoke.mjs
          node scripts/test-friend-check-ssrf.mjs
      - name: 备配置并验工具链（Pages 没有干跑命令，验 wrangler 能跑、令牌能连）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          MEDIA_PUBLIC_BASE: ${{ secrets.MEDIA_PUBLIC_BASE }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then echo "::error::未配置 D1_DATABASE_ID（仓库 Secrets），终止"; exit 1; fi
          esc_slash() { printf '%s' "$1" | sed -e 's/[\\&/]/\\&/g'; }
          esc_pipe() { printf '%s' "$1" | sed -e 's/[\\&|]/\\&/g'; }
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s/00000000-0000-0000-0000-000000000000/$(esc_slash "$D1_DATABASE_ID")/" wrangler.toml
          fi
          if [ -n "$MEDIA_PUBLIC_BASE" ]; then
            sed -i "s|https://media.example.com|$(esc_pipe "$MEDIA_PUBLIC_BASE")|" wrangler.toml
          fi
          EP="$R2_S3_ENDPOINT"
          if [ -z "$EP" ]; then EP="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"; fi
          sed -i "s|https://00000000000000000000000000000000.r2.cloudflarestorage.com|$(esc_pipe "$EP")|" wrangler.toml
          grep -qF "$D1_DATABASE_ID" wrangler.toml
          npx -y wrangler pages project list
      - name: 有升级就提交并触发部署，没升级就留心跳
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          echo "last auto-upgrade run: $DATE" > .github/auto-upgrade-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json; then
            git add .github/auto-upgrade-heartbeat.txt
            git commit -m "chore: 每周试升级心跳 $DATE [skip ci]"
            git push
            echo "本周没有可升级的依赖，已留心跳。"
          else
            git add package.json package-lock.json .github/auto-upgrade-heartbeat.txt
            git commit -m "auto-upgrade: 依赖周更 $DATE（测试全过）"
            git push
            gh workflow run deploy.yml --ref main
            echo "已提交升级并触发正式部署。"
          fi
